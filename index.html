<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Helal</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <script>
      try {
        var t = localStorage.getItem("helal.theme");
        document.documentElement.dataset.theme = t === "bright" ? "bright" : "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=20261019-gehad-social" />
    <link rel="icon" href="./assets/helal-mark.png" />
  </head>
  <body>
    <div id="app" class="boot-mode">
      <div class="boot-screen" role="status" aria-live="polite">
        <div class="boot-mark-wrap">
          <img class="boot-mark" src="./assets/helal-mark.png" alt="" width="88" height="88" />
          <span class="boot-ring" aria-hidden="true"></span>
        </div>
        <strong class="boot-title">Helal</strong>
        <p class="boot-copy">Loading your board…</p>
      </div>
    </div>
    <script src="./app.js?v=20261031-nouran"></script>
  </body>
</html>
